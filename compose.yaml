services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: isocode
      POSTGRES_USER: isocode
      POSTGRES_PASSWORD: isocode_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U isocode -d isocode"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build:
      context: .
      target: development
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgresql://isocode:isocode_local@db:5432/isocode
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
